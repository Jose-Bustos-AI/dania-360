<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Cada servicio, una conversación</title><desc id="d">Diagrama editorial con tres líneas que conectan instalaciones, mantenimiento y recarga con una consulta al profesional. No es un esquema eléctrico.</desc><rect width="640" height="480" rx="24" fill="#121211"/><g fill="none" stroke="#544b40" stroke-width="2"><path d="M75 160h180l80 80h210M75 240h470M75 320h180l80-80"/></g><path d="M75 160h180l80 80h210M75 320h180l80-80" fill="none" stroke="#ff7139" stroke-width="6"/><g fill="#15110e" stroke="#ff7139" stroke-width="3"><circle cx="75" cy="160" r="15"/><circle cx="75" cy="240" r="15"/><circle cx="75" cy="320" r="15"/><rect x="430" y="203" width="170" height="75" rx="12"/></g><g font-family="system-ui,sans-serif" fill="#f4ede3"><text x="38" y="54" font-size="18" letter-spacing="2">TRES SERVICIOS. UN CONTACTO CLARO.</text><text x="103" y="141" font-size="21">Instalaciones</text><text x="103" y="224" font-size="21">Mantenimiento</text><text x="103" y="351" font-size="21">Recarga</text><text x="462" y="248" font-size="21" font-weight="700">Consulta</text><text x="40" y="428" font-size="14" fill="#c1b8af">Esquema de comunicación, no de instalación</text></g></svg>
