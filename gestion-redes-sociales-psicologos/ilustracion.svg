<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">El primer contacto con una consulta de psicología</title><desc id="desc">Tres tarjetas conceptuales distinguen información del centro, situación personal y cita existente. No contienen mensajes reales.</desc><g font-family="Arial,sans-serif"><rect width="640" height="480" rx="26" fill="#F0E6D2"/><text x="36" y="53" fill="#302A24" font-size="21" font-weight="700">CADA MENSAJE TIENE SU CANAL</text><path d="M75 137V379M75 178H123M75 278H123M75 378H123" stroke="#B5A58B" stroke-width="5" fill="none"/><circle cx="75" cy="119" r="15" fill="#FF7139"/><rect x="123" y="129" width="475" height="81" rx="14" fill="#302A24"/><text x="148" y="163" fill="#F0E6D2" font-size="22">Información del centro</text><text x="148" y="191" fill="#D2C6AE" font-size="16">Orientación sobre el servicio</text><rect x="123" y="229" width="475" height="81" rx="14" fill="#FF7139"/><text x="148" y="263" fill="#241C17" font-size="22">Situación personal</text><text x="148" y="291" fill="#241C17" font-size="16">Continuación con el equipo</text><rect x="123" y="329" width="475" height="81" rx="14" fill="#302A24"/><text x="148" y="363" fill="#F0E6D2" font-size="22">Cita existente</text><text x="148" y="391" fill="#D2C6AE" font-size="16">Canal de atención acordado</text></g></svg>
