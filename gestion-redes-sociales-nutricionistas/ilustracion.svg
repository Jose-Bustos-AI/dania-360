<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Un carrusel para explicar el servicio de nutrición</title><desc id="desc">Cuatro tarjetas conceptuales presentan el primer contacto, la consulta, el seguimiento y la forma de informarse. No son recomendaciones de salud.</desc><g font-family="Arial,sans-serif"><rect width="640" height="480" rx="26" fill="#f9f6f5"/><text x="35" y="52" fill="#2c2517" font-size="21" font-weight="700">ASÍ SE PRESENTA LA CONSULTA</text><rect x="35" y="88" width="273" height="157" rx="16" fill="#2c2517"/><text x="55" y="127" fill="#df7d5a" font-size="18" font-weight="700">01</text><text x="55" y="168" fill="#dbd5cf" font-size="23">Primer contacto</text><path d="M55 199H264M55 218H216" stroke="#74644a" stroke-width="6"/><rect x="329" y="88" width="273" height="157" rx="16" fill="#74644a"/><text x="350" y="127" fill="#dbd5cf" font-size="18" font-weight="700">02</text><text x="350" y="168" fill="#dbd5cf" font-size="23">La consulta</text><path d="M350 199H560M350 218H507" stroke="#b0a290" stroke-width="6"/><rect x="35" y="267" width="273" height="157" rx="16" fill="#FF7139"/><text x="55" y="306" fill="#241C17" font-size="18" font-weight="700">03</text><text x="55" y="348" fill="#241C17" font-size="23">Seguimiento</text><path d="M55 379H264M55 398H216" stroke="#e7ae96" stroke-width="6"/><rect x="329" y="267" width="273" height="157" rx="16" fill="#2c2517"/><text x="350" y="306" fill="#df7d5a" font-size="18" font-weight="700">04</text><text x="350" y="348" fill="#dbd5cf" font-size="23">Cómo informarse</text><path d="M350 379H560M350 398H507" stroke="#74644a" stroke-width="6"/></g></svg>
