<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">La casa y el uso del espacio</title><desc id="desc">Casa abstracta junto a dos anotaciones editoriales sobre el espacio que se muestra y el uso que confirma el anfitrión. No es un plano de un alojamiento.</desc><rect width="640" height="480" rx="24" fill="#efe5d2"/><text x="36" y="54" fill="#3b3026" font-family="Arial,sans-serif" font-weight="700" font-size="23">ENTENDER LA CASA</text><path d="M55 255L221 118l167 137M88 228v190h268V228" fill="#b9a78e" stroke="#3b3026" stroke-width="8" stroke-linejoin="round"/><rect x="190" y="304" width="66" height="114" fill="#3b3026"/><rect x="120" y="270" width="42" height="52" fill="#efe5d2"/><rect x="284" y="270" width="42" height="52" fill="#efe5d2"/><path d="M222 219h179M340 336h61" stroke="#ff7139" stroke-width="4"/><circle cx="222" cy="219" r="7" fill="#ff7139"/><circle cx="340" cy="336" r="7" fill="#ff7139"/><rect x="402" y="175" width="208" height="91" rx="9" fill="#3b3026"/><rect x="402" y="292" width="208" height="91" rx="9" fill="#ff7139"/><g font-family="Arial,sans-serif" font-size="21"><text x="422" y="211" fill="#efe5d2">Espacio</text><text x="422" y="239" fill="#efe5d2">mostrado</text><text x="422" y="328" fill="#21170f">Uso</text><text x="422" y="356" fill="#21170f">confirmado</text></g></svg>
