<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Una empresa que se reconoce</title><desc id="d">Tarjeta editorial original con un candado simbólico y tres campos de identidad, zona y horario. No muestra una cerradura real ni métodos de apertura.</desc><rect width="640" height="480" rx="28" fill="#f9f6f4"/><rect x="65" y="72" width="510" height="336" rx="16" fill="#ffffff" stroke="#c19f8b" stroke-width="2"/><rect x="65" y="72" width="510" height="9" fill="#ff7139"/><path d="M120 213v-34a36 36 0 0 1 72 0v34" fill="none" stroke="#2c2317" stroke-width="10"/><rect x="104" y="211" width="104" height="91" rx="12" fill="#ff7139"/><circle cx="156" cy="248" r="10" fill="#fbf7f3"/><path d="M156 257v17" stroke="#fbf7f3" stroke-width="8"/><g font-family="system-ui,sans-serif" fill="#2c2317"><text x="256" y="175" font-size="22" font-weight="700">Identidad</text><text x="256" y="241" font-size="22" font-weight="700">Zona</text><text x="256" y="307" font-size="22" font-weight="700">Horario</text><text x="104" y="369" font-size="16" fill="#4c433b">Un contacto coherente en cada canal</text></g><path d="M256 190h260M256 256h200M256 322h230" stroke="#c7b1a3" stroke-width="3"/></svg>
