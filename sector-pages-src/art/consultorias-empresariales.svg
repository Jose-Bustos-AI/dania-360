<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Un encargo de consultoría comprensible</title><desc id="desc">Un tablero editorial relaciona contexto, entregable y alcance. No acredita un proyecto o resultado de un cliente.</desc><g font-family="Arial,sans-serif"><rect width="640" height="480" rx="26" fill="#F0E6D2"/><text x="35" y="52" fill="#302A24" font-size="22" font-weight="700">EL ENCARGO, EXPLICADO</text><path d="M140 180H312V310H493" stroke="#B5A58B" stroke-width="8" fill="none"/><rect x="48" y="106" width="189" height="151" rx="12" fill="#302A24"/><text x="69" y="147" fill="#F0E6D2" font-size="22">Contexto</text><path d="M70 177H210M70 207H187" stroke="#B5A58B" stroke-width="7"/><rect x="360" y="238" width="231" height="166" rx="12" fill="#FF7139"/><text x="380" y="279" fill="#241C17" font-size="22">Entregable</text><path d="M381 308H564M381 338H530M381 368H546" stroke="#693018" stroke-width="7"/><rect x="265" y="90" width="316" height="86" rx="12" fill="#B5A58B"/><text x="288" y="126" fill="#302A24" font-size="21">Alcance por confirmar</text><path d="M289 149H549" stroke="#6F614F" stroke-width="5"/><text x="48" y="444" fill="#302A24" font-size="18">Demostración editorial, sin resultados atribuidos</text></g></svg>
