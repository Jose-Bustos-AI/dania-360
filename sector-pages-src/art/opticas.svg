<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Una montura y el centro que la presenta</title><desc id="desc">Tres vistas conceptuales relacionan una montura, su perfil y el asesoramiento de la óptica. No muestran una referencia real.</desc><g font-family="Arial,sans-serif"><rect width="640" height="480" rx="26" fill="#F0E6D2"/><text x="34" y="52" font-size="22" font-weight="700" fill="#302A24">MONTURA Y ASESORAMIENTO</text><g stroke="#302A24" stroke-width="10" fill="none"><rect x="66" y="119" width="153" height="108" rx="40"/><rect x="258" y="119" width="153" height="108" rx="40"/><path d="M219 150Q239 129 258 150M40 131H66M411 131H438"/></g><path d="M79 307H382L430 331" fill="none" stroke="#B5A58B" stroke-width="12"/><circle cx="79" cy="307" r="12" fill="#FF7139"/><rect x="443" y="112" width="158" height="231" rx="14" fill="#302A24"/><text x="462" y="154" fill="#F0E6D2" font-size="17">En el centro</text><path d="M462 180H578M462 205H560" stroke="#B5A58B" stroke-width="6"/><rect x="460" y="248" width="123" height="55" rx="8" fill="#FF7139"/><text x="474" y="281" fill="#241C17" font-size="16">Consultar</text><text x="50" y="416" fill="#302A24" font-size="18">Frontal · Perfil · Atención</text></g></svg>
