<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Una solicitud y un envío iniciado</title><desc id="desc">Un esquema de origen y destino acompaña dos rutas de información; no muestra una expedición real o seguimiento.</desc><g font-family="Arial,sans-serif"><rect width="640" height="480" rx="28" fill="#17120E"/><text x="35" y="53" fill="#F0E6D2" font-size="23" font-weight="700">EL MOTIVO DEL CONTACTO IMPORTA</text><path d="M126 167H511" stroke="#B5A58B" stroke-width="7" stroke-dasharray="13 12"/><circle cx="126" cy="167" r="38" fill="#FF7139"/><circle cx="511" cy="167" r="38" fill="#F0E6D2"/><g fill="#F0E6D2" font-size="20"><text x="92" y="237">Origen</text><text x="472" y="237">Destino</text></g><rect x="45" y="296" width="550" height="61" rx="10" fill="#FF7139"/><text x="70" y="335" fill="#241C17" font-size="22">Nueva solicitud · área comercial</text><rect x="45" y="375" width="550" height="61" rx="10" fill="#302A24" stroke="#B5A58B" stroke-width="2"/><text x="70" y="414" fill="#F0E6D2" font-size="22">Envío iniciado · canal de atención</text></g></svg>
